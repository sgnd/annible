# Main playbook. install.sh runs it. Settings come from config.yml through inventory.py.

- name: Check servers
  hosts: all
  gather_facts: true
  any_errors_fatal: true  # one failed check stops the whole install, before anything changes
  tasks:
    - name: Check operating system
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Ubuntu'
          - ansible_distribution_version in ['24.04', '26.04']
        fail_msg: "Ubuntu 24.04 or 26.04 is required, found {{ ansible_distribution }} {{ ansible_distribution_version }}."

    - name: Check Ubuntu version matches the offline bundle
      ansible.builtin.assert:
        that: ansible_distribution_version == bundle.ubuntu
        fail_msg: >-
          The bundle is for Ubuntu {{ bundle.ubuntu }}, this node runs {{ ansible_distribution_version }}.
          Build one with: ./build-bundle.sh {{ node_arch }} {{ ansible_distribution_version }}
      when: offline

    - name: Check CPU architecture
      ansible.builtin.assert:
        that: node_arch == arch | default('amd64')
        fail_msg: "config.yml arch is {{ arch | default('amd64') }} but this node is {{ node_arch }}. All nodes must match it (amd64 or arm64)."

    # Before anything changes: does config.yml still match the swarm? (No Docker yet = a new server.)
    - name: Read swarm state
      ansible.builtin.command: docker info --format '{% raw %}{{ .Swarm.LocalNodeState }} {{ .Swarm.ControlAvailable }}{% endraw %}'
      register: swarm_now
      failed_when: false
      changed_when: false
      when: inventory_hostname in groups['swarm']

    # The registry lives on the first manager. If another manager has it, the managers were
    # reordered (or a new one was put first). Stop before anything moves.
    - name: Look for the registry
      ansible.builtin.stat:
        path: "{{ apps_dir }}/registry/ca/ca.crt"
      register: registry_here
      when: inventory_hostname in groups['managers']

    - name: Check the first manager in config.yml has the registry
      ansible.builtin.assert:
        that: >-
          hostvars[swarm_leader].registry_here.stat.exists or
          groups['managers'] | intersect(ansible_play_hosts) | map('extract', hostvars, ['registry_here', 'stat', 'exists'])
          | select | list | length == 0
        fail_msg: >-
          {{ swarm_leader }} is listed first in config.yml, but the registry (and the swarm's start) is on another manager.
          Keep the original first manager first in the nodes list, and add new managers after it.
      run_once: true

    - name: Check each server's role matches the swarm
      ansible.builtin.assert:
        that: swarm_now.stdout.split() | last == ('true' if node_role == 'manager' else 'false')
        fail_msg: >-
          {{ inventory_hostname }} is {{ node_role }} in config.yml but not in the swarm. Change it by hand
          on a manager: sudo docker node {{ 'promote' if node_role == 'manager' else 'demote' }} {{ inventory_hostname }}
      when: inventory_hostname in groups['swarm'] and swarm_now.stdout is match('active')

- name: Base system
  hosts: all
  environment: "{{ apt_env }}"  # offline: apt uses only the bundle
  roles:
    - role: bundle
      when: offline
    - common
    - docker

- name: Registry
  hosts: all
  roles:
    - registry

- name: Swarm
  hosts: swarm
  roles:
    - swarm

# Apps that run on one server with Docker Compose, like databases.
- name: Server apps
  hosts: all
  tasks:
    - name: Deploy server apps
      ansible.builtin.include_role:
        name: "{{ app }}"
      loop: "{{ node_apps }}"
      loop_control:
        loop_var: app

- name: Beszel agents
  hosts: all
  tasks:
    - name: Deploy Beszel agent on every server
      ansible.builtin.include_role:
        name: beszel
        tasks_from: agent
      when: "'beszel' in apps"

- name: Swarm apps
  hosts: managers[0]
  tasks:
    - name: Deploy swarm apps
      ansible.builtin.include_role:
        name: "{{ app }}"
      loop: "{{ swarm_apps }}"
      loop_control:
        loop_var: app

- name: Summary
  hosts: managers[0]
  gather_facts: false
  tasks:
    - name: Create state folder
      ansible.builtin.file:
        path: "{{ playbook_dir }}/state"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    - name: Save summary to state/summary.md
      ansible.builtin.template:
        src: templates/summary.md.j2
        dest: "{{ playbook_dir }}/state/summary.md"
        mode: "0600"
      delegate_to: localhost
      become: false
      diff: false  # has passwords
      changed_when: false  # the date in it changes every run

    - name: Show DNS setting
      ansible.builtin.debug:
        msg: "DNS for *.{{ domain }} must point to the public IP of {{ inventory_hostname }}."

    - name: Show how to reach each app
      ansible.builtin.debug:
        msg: "{{ app }}: {{ catalog[app].info | replace('<domain>', domain) | replace('<ip>', hostvars[target].node_ip | default('')) }}"
      vars:
        app: "{{ item.key }}"
        target: "{{ item.value }}"
      loop: "{{ apps | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Show where the summary is
      ansible.builtin.debug:
        msg: "All of this, plus the passwords, is saved in {{ playbook_dir }}/state/summary.md. Back up state/."
