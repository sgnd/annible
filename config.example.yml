# Copy to config.yml and change it. Every setting is explained here.

domain: example.com        # web pages get <name>.example.com, for example traefik.example.com
tls: letsencrypt           # letsencrypt | selfsigned (no internet) | custom
acme_email: admin@example.com      # for tls: letsencrypt
# acme_server: https://acme-staging-v02.api.letsencrypt.org/directory
#                          # optional: another ACME server, e.g. Let's Encrypt staging for tests,
#                          # or one in your own network (step-ca) for offline installs
# acme_ca_cert: ./certs/acme-ca.pem # optional: CA certificate of that ACME server, if it is private
# tls_cert: ./certs/fullchain.pem   # for tls: custom, a wildcard cert for *.example.com
# tls_key: ./certs/privkey.pem      # paths are relative to this file
timezone: Asia/Jakarta
arch: amd64                # CPU of your servers (not your laptop): amd64 (Intel/AMD) | arm64.
                           # All servers must use the same one.

ssh:
  user: ubuntu             # needs passwordless sudo
  key: ~/.ssh/id_ed25519   # paths are relative to this file
  port: 22
  allow_from: []           # IPs or ranges that may SSH in, e.g. [203.0.113.0/24]. Empty = anyone

# Who may open the admin web pages: Traefik dashboard, Kong Manager, Portainer, Swarmpit,
# RabbitMQ, RustFS, NATS, Uptime Kuma and Beszel. Example: [203.0.113.0/24]
# Empty = anyone, protected only by each page's password.
# (Keycloak and Authelia are login pages for everyone, so they are not limited.)
admin_allow_from: []

# Your servers.
#   name: lowercase letters, numbers and -
#   ip:   the private IPv4 the servers use to talk to each other.
#         The installer also connects to it over SSH.
#   role: manager    runs the swarm and swarm apps (use 1, 3 or 5)
#         worker     runs swarm apps
#         standalone not in the swarm, runs server apps like databases
#   labels: optional tags for your own swarm placement rules, e.g. node.labels.tier == app.
#           The installer only adds labels; remove old ones by hand (sudo docker node update --label-rm <key> <node>).
nodes:
  - name: swarm1
    ip: 10.0.0.11
    role: manager
  - name: swarm2
    ip: 10.0.0.12
    role: worker
    labels:
      tier: app
  - name: data1
    ip: 10.0.0.21
    role: standalone

# Apps to install and where they run. Apps not listed are not installed.
#   swarm       = a swarm service: traefik, kong, portainer, swarmpit, keycloak, authelia
#   <node name> = runs on that server: databases, caches, storage, queues, monitoring
# One app per category. All apps are in catalog.yml.
apps:
  traefik: swarm           # needed by every app with a web page
  portainer: swarm         # or swarmpit
  # kong: swarm            # API gateway, needs postgres
  # keycloak: swarm        # login, or authelia (needs a database; authelia also a cache)
  postgres: data1          # or mariadb
  redis: data1             # or valkey
  rustfs: data1            # or garage
  rabbitmq: data1          # or nats
  # uptimekuma: data1      # or beszel
