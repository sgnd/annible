# Copy to config.yml and adjust.

domain: example.com        # apps get <app>.example.com, point DNS to the first manager
acme_email: admin@example.com
tls: letsencrypt           # letsencrypt | selfsigned | custom
# tls_cert: ./certs/fullchain.pem   # for tls: custom (wildcard for the domain)
# tls_key: ./certs/privkey.pem
timezone: Asia/Jakarta
arch: amd64                # target servers, not your laptop: amd64 (Intel/AMD) | arm64

ssh:
  user: ubuntu
  key: ~/.ssh/id_ed25519   # relative paths are resolved from this file's directory
  port: 22
  allow_from: []           # CIDRs allowed to SSH; empty = anywhere

admin_allow_from: []       # CIDRs allowed to open admin UIs; empty = anywhere (password protected)

# role: manager | worker | standalone (outside swarm, runs docker compose apps)
# Managers must be an odd number (1, 3, 5).
nodes:
  - name: swarm1
    ip: 10.0.0.11
    role: manager
  - name: swarm2
    ip: 10.0.0.12
    role: worker
    labels:
      tier: app
  - name: data1
    ip: 10.0.0.21
    role: standalone

# App to install and where: swarm, or a node name. Apps not listed are not installed.
# See catalog.yml for what is available.
apps:
  traefik: swarm
  portainer: swarm
