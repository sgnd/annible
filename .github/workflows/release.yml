# Build the offline bundles when a version tag (like v1.1.0) is pushed, and attach them to its
# GitHub release. "Run workflow" on GitHub builds them without a release (to test the build).
# GitHub allows files up to 2 GB, so each bundle is split into parts (see docs/offline.md).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read only by default. Each job asks for write itself, only where it needs it.
permissions:
  contents: read

jobs:
  # Make the release first, so the bundle jobs only add files to it.
  release:
    name: Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write  # to make the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Make the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with a dash (v1.1.0-rc1) is a test release: marked as pre-release.
          pre=$([[ "$GITHUB_REF_NAME" == *-* ]] && echo true || echo false)
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --prerelease="$pre" --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md. Offline bundles: docs/offline.md."

  bundle:
    name: Bundle ${{ matrix.ubuntu }}
    needs: release
    if: always() && needs.release.result != 'failure'
    strategy:
      fail-fast: false  # one bundle failing does not stop the others
      matrix:
        ubuntu: ["24.04", "26.04"]
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # to upload the bundles to the release (only the last step gets the token)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # build-bundle.sh does not need the token, so it is not left in .git
      - name: Make disk space (a bundle needs about 10 GB while it is built)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
      - name: Build the bundle
        run: ./build-bundle.sh ${{ matrix.ubuntu }}
      - name: Split it into parts of 1.9 GB
        run: |
          cd dist
          file=ansibro-${{ matrix.ubuntu }}.tar.gz
          sha256sum "$file" > "$file.sha256"
          split -b 1900m -d "$file" "$file.part"
          rm "$file"
          ls -lh
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/ansibro-* --clobber
