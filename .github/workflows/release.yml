# Build the offline bundles when a version tag (like v1.1.0) is pushed, and attach them to its
# GitHub release. "Run workflow" on GitHub builds them without a release (to test the build).
# GitHub allows files up to 2 GB, so each bundle is split into parts (see README "Offline install").
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # to make the release and upload the bundles

jobs:
  # Make the release first, so the four bundle jobs only add files to it.
  release:
    name: Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Make the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md. Offline bundles: README, Offline install."

  bundle:
    name: Bundle ${{ matrix.ubuntu }} ${{ matrix.arch }}
    needs: release
    if: always() && needs.release.result != 'failure'
    strategy:
      fail-fast: false  # one bundle failing does not stop the others
      matrix:
        include:
          - { arch: amd64, ubuntu: "24.04", runner: ubuntu-24.04 }
          - { arch: amd64, ubuntu: "26.04", runner: ubuntu-24.04 }
          - { arch: arm64, ubuntu: "24.04", runner: ubuntu-24.04-arm }
          - { arch: arm64, ubuntu: "26.04", runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Make disk space (a bundle needs about 10 GB while it is built)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
      - name: Build the bundle
        run: ./build-bundle.sh ${{ matrix.arch }} ${{ matrix.ubuntu }}
      - name: Split it into parts of 1.9 GB
        run: |
          cd dist
          file=ansibro-${{ matrix.ubuntu }}-${{ matrix.arch }}.tar.gz
          sha256sum "$file" > "$file.sha256"
          split -b 1900m -d "$file" "$file.part"
          rm "$file"
          ls -lh
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/ansibro-* --clobber
