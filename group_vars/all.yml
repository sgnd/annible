node_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_architecture] | default(ansible_architecture) }}"
swarm_leader: "{{ groups['managers'][0] }}"
# Every manager runs a registry with the same images, so images can still be pulled when one
# manager is down. Apps use the name below: managers find their own registry under it,
# the other servers the first manager's (set in /etc/hosts).
registry_host: registry.ansibro
registry_addr: "{{ registry_host }}:{{ registry_port }}"
registry_ip: "{{ node_ip if inventory_hostname in groups['managers'] else hostvars[swarm_leader].node_ip }}"
# The CPU types of the servers (amd64, arm64). The registry keeps each image for all of them.
registry_platforms: "{{ groups['all'] | map('extract', hostvars, 'node_arch') | unique | sort }}"
# The registry needs a login, so a container cannot push a fake image into it.
registry_user: ansibro
registry_password: "{{ lookup('ansible.builtin.password', secrets_dir ~ '/registry', chars=['ascii_letters', 'digits'], length=32) }}"

# Traefik runs on every manager, so the apps stay reachable when one manager is down. Point DNS
# to all of them. Let's Encrypt (and acme_server) checks a domain by calling it, and the call can
# reach another manager, so with them Traefik runs only on the first manager.
# On k3s, every cluster server answers on 80 and 443 (k3s's built-in load balancer).
traefik_nodes: >-
  {{ groups['swarm'] if orchestrator == 'k3s'
  else [swarm_leader] if tls | default('letsencrypt') == 'letsencrypt' else groups['managers'] }}

# Swarm apps without data run on servers with the label tier=app, if there are any
# (servers without server apps get it; see inventory.py).
swarm_app_constraint: >-
  {{ 'node.labels.tier == app' if groups['swarm'] | map('extract', hostvars, 'node_labels')
  | selectattr('tier', 'defined') | selectattr('tier', 'equalto', 'app') | list else '' }}

# Each app keeps its files in /opt/ansibro/<app>/ on the server it runs on.
apps_dir: /opt/ansibro

# Offline install: where the bundle goes on each server, and how apt uses it.
bundle_dir: "{{ apps_dir }}/bundle"
apt_env: "{{ {'APT_CONFIG': bundle_dir ~ '/apt.conf'} if offline else {} }}"

# Generated passwords, kept on the machine running the installer.
secrets_dir: "{{ playbook_dir }}/state/secrets"

# Where the database and cache run, for apps that need them (empty if not installed).
database_app: "{{ 'postgres' if 'postgres' in apps else 'mariadb' if 'mariadb' in apps else '' }}"
database_ip: "{{ hostvars[apps[database_app]].node_ip if database_app else '' }}"
cache_app: "{{ 'redis' if 'redis' in apps else 'valkey' if 'valkey' in apps else '' }}"
cache_ip: "{{ hostvars[apps[cache_app]].node_ip if cache_app else '' }}"
cache_password: "{{ lookup('ansible.builtin.password', secrets_dir ~ '/' ~ cache_app, chars=['ascii_letters', 'digits'], length=24) if cache_app else '' }}"

# ./install.sh -e remove_nodes=true removes servers from the swarm that are not in config.yml.
remove_nodes: false

# ./install.sh -e restore=true puts the newest backup back on new servers (see roles/backup).
restore: false

# The monitoring app (prometheus or victoria), and the server it runs on. Empty if not installed.
monitoring_app: "{{ 'prometheus' if 'prometheus' in apps else 'victoria' if 'victoria' in apps else '' }}"
monitoring_ip: "{{ hostvars[apps[monitoring_app]].node_ip if monitoring_app else '' }}"
