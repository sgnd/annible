# Available apps, in deploy order.
#   category: only one app per category can be installed
#   runs_on:  swarm (swarm service) | node (docker compose on one server)
#   requires: apps or categories that must also be installed (optional),
#             e.g. "database" = postgres or mariadb
#   license:  the app's open-source license
#   info:     how to reach it, shown at the end of the install
#             <ip> = the server it runs on, <domain> = domain in config.yml

traefik:
  category: gateway
  runs_on: swarm
  license: MIT
  info: "https://traefik.<domain> (user admin, password state/secrets/traefik_admin)"

kong:
  category: api-gateway
  runs_on: swarm
  requires: [postgres, traefik]
  license: Apache-2.0
  info: "APIs at https://kong.<domain>, Kong Manager https://kong-manager.<domain> (Traefik dashboard password)"

portainer:
  category: management
  runs_on: swarm
  requires: [traefik]
  license: zlib
  info: "https://portainer.<domain> (user admin, password state/secrets/portainer_admin)"

swarmpit:
  category: management
  runs_on: swarm
  requires: [traefik]
  license: EPL-1.0
  info: "https://swarmpit.<domain> (create the admin user on first visit)"

keycloak:
  category: auth
  runs_on: swarm
  requires: [database, traefik]
  license: Apache-2.0
  info: "https://keycloak.<domain> (user admin, password state/secrets/keycloak_admin)"

authelia:
  category: auth
  runs_on: swarm
  requires: [database, cache, traefik]
  license: Apache-2.0
  info: "https://authelia.<domain> (user admin, password state/secrets/authelia_admin). Protect an app with the Traefik middleware authelia@file"

postgres:
  category: database
  runs_on: node
  license: PostgreSQL
  info: "<ip>:5432 (user postgres, password state/secrets/postgres)"

mariadb:
  category: database
  runs_on: node
  license: GPL-2.0
  info: "<ip>:3306 (user root, password state/secrets/mariadb)"

redis:
  category: cache
  runs_on: node
  license: AGPL-3.0 (Redis 8 is tri-licensed, used under AGPL)
  info: "<ip>:6379 (password state/secrets/redis)"

valkey:
  category: cache
  runs_on: node
  license: BSD-3-Clause
  info: "<ip>:6379 (password state/secrets/valkey)"

rustfs:
  category: storage
  runs_on: node
  license: Apache-2.0
  info: "S3 http://<ip>:9000, console https://rustfs.<domain>/rustfs/console/ (keys state/secrets/rustfs_access_key, rustfs_secret_key)"

garage:
  category: storage
  runs_on: node
  license: AGPL-3.0
  info: "S3 http://<ip>:3900, region garage (keys state/secrets/garage_access_key with GK prefix, garage_secret_key)"

rabbitmq:
  category: queue
  runs_on: node
  license: MPL-2.0
  info: "amqp://<ip>:5672, UI https://rabbitmq.<domain> (user admin, password state/secrets/rabbitmq)"

nats:
  category: queue
  runs_on: node
  license: Apache-2.0
  info: "nats://<ip>:4222 (user admin, password state/secrets/nats), monitoring https://nats.<domain>"

uptimekuma:
  category: monitoring
  runs_on: node
  license: MIT
  info: "https://uptimekuma.<domain> (create the admin user on first visit)"

beszel:
  category: monitoring
  runs_on: node
  license: MIT
  info: "https://beszel.<domain> (user admin@<domain>, password state/secrets/beszel_admin). Agents run on every server"
