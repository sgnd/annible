# Install Docker from the official apt repo (or the offline bundle), with versions from versions.yml.

- name: Add Docker apt key
  ansible.builtin.get_url:
    url: "{{ docker_apt_url }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  when: not offline

- name: Add Docker apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.list
    content: >
      deb [arch={{ node_arch }} signed-by=/etc/apt/keyrings/docker.asc]
      {{ docker_apt_url }} {{ ansible_distribution_release }} stable
    mode: "0644"
  register: docker_repo
  when: not offline

- name: Install Docker packages
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    update_cache: "{{ docker_repo.changed }}"
    allow_change_held_packages: true
    allow_downgrade: true

# Hold = "apt upgrade" will not change the Docker version.
- name: Hold Docker packages
  ansible.builtin.dpkg_selections:
    name: "{{ item.split('=')[0] }}"
    selection: hold
  loop: "{{ docker_packages }}"

- name: Configure Docker daemon
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    mode: "0644"
  notify: Restart docker

- name: Start Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
