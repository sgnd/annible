# Monitoring: shared by the two choices, prometheus and victoria (monitoring_app in group_vars).
# The server part runs where the app is set in config.yml, the agent part on every server.
observability_dir: "{{ apps_dir }}/{{ monitoring_app }}"
observability_agent_dir: "{{ apps_dir }}/monitoring-agent"

# How long metrics and logs are kept.
observability_keep_days: "{{ (monitoring | default({})).keep_days | default(30) }}"

# Ports on the monitoring server. Everything listens on the server's ip only.
observability_metrics_port: "{{ 9090 if monitoring_app == 'prometheus' else 8428 }}"
observability_logs_port: "{{ 3100 if monitoring_app == 'prometheus' else 9428 }}"
observability_vmalert_port: 8880
observability_alertmanager_port: 9093
observability_grafana_port: 3000

# Ports of the agents on every server.
# The firewall opens these ports too: if you change one, change it in
# common_app_ports (roles/common/defaults/main.yml) as well.
observability_node_exporter_port: 9100
observability_cadvisor_port: 9280
observability_vector_port: 9598
observability_postgres_exporter_port: 9187
observability_mysqld_exporter_port: 9104
observability_redis_exporter_port: 9121
observability_traefik_metrics_port: 8082

# The port of each server app. Every minute, each server checks that its apps answer there.
# These are the same ports as in common_app_ports (roles/common/defaults/main.yml), for the firewall.
observability_app_ports:
  postgres: 5432
  mariadb: 3306
  redis: 6379
  valkey: 6379
  rustfs: 9000
  garage: 3900
  rabbitmq: 5672
  nats: 4222
  uptimekuma: 3001
  beszel: 8090
  openbao: 8200
  prometheus: 9090
  victoria: 8428

# The images each part needs.
observability_server_images:
  prometheus: [prometheus, loki, alertmanager, grafana]
  victoria: [victoriametrics, victorialogs, vmalert, alertmanager, grafana]

# Generated once and saved in state/secrets/ on the installer machine.
observability_grafana_password: "{{ lookup('ansible.builtin.password', secrets_dir ~ '/grafana_admin', chars=['ascii_letters', 'digits'], length=24) }}"
# The exporters log in to the databases as user "monitor", which can only read stats.
observability_monitor_password: "{{ lookup('ansible.builtin.password', secrets_dir ~ '/monitor', chars=['ascii_letters', 'digits'], length=24) }}"
