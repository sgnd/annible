# NVIDIA GPU servers (gpu: true in config.yml): the NVIDIA driver, and the NVIDIA Container Toolkit
# so containers can use the GPU. Runs before Docker, which then uses the "nvidia" runtime by default.
# Needs internet (the toolkit comes from NVIDIA's apt repository).

- name: Check the NVIDIA driver
  ansible.builtin.command: nvidia-smi -L
  register: gpu_smi
  failed_when: false
  changed_when: false

- name: Install the tool that finds the right NVIDIA driver
  ansible.builtin.apt:
    name: ubuntu-drivers-common
    update_cache: true
  when: gpu_smi.rc != 0

# The newest server (headless) driver that Ubuntu has for this GPU, and nvidia-smi. The "open"
# kernel modules first: NVIDIA's choice for newer GPUs, and some versions only come that way.
- name: Install the NVIDIA driver
  ansible.builtin.shell:
    cmd: |
      set -eo pipefail
      drivers=$(ubuntu-drivers list --gpgpu 2>/dev/null | grep -oE 'nvidia-driver-[0-9]+-server(-open)?' || true)
      driver=$(grep -- '-open$' <<< "$drivers" | sort -V | tail -1)
      [ -n "$driver" ] || driver=$(sort -V <<< "$drivers" | tail -1)
      if [ -z "$driver" ]; then echo "Ubuntu has no NVIDIA driver for this server's GPU" >&2; exit 1; fi
      flavor=${driver#nvidia-driver-}              # for example 615-server-open
      version=${flavor%%-*}                         # 615
      ubuntu-drivers install --gpgpu "nvidia:${flavor}"
      DEBIAN_FRONTEND=noninteractive apt-get install -y -q "nvidia-utils-${version}-server"
      # Stop here if the kernel part did not come (it would only show after the restart).
      dpkg -l | grep -q "linux-modules-nvidia-${version}-server" || { echo "the NVIDIA kernel modules were not installed" >&2; exit 1; }
    executable: /bin/bash
  when: gpu_smi.rc != 0
  changed_when: true

# The driver loads after a restart. If the installer runs on this server, restart it by hand
# and run ./install.sh again.
- name: Restart to load the NVIDIA driver
  ansible.builtin.reboot:
    reboot_timeout: 900
  when: gpu_smi.rc != 0

- name: Check the GPU works
  ansible.builtin.command: nvidia-smi -L
  changed_when: false

- name: Add NVIDIA container apt key
  ansible.builtin.get_url:
    url: https://nvidia.github.io/libnvidia-container/gpgkey
    dest: /etc/apt/keyrings/nvidia-container.asc
    mode: "0644"

- name: Add NVIDIA container apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/nvidia-container.list
    content: >
      deb [signed-by=/etc/apt/keyrings/nvidia-container.asc]
      https://nvidia.github.io/libnvidia-container/stable/deb/{{ node_arch }} /
    mode: "0644"

- name: Install the NVIDIA Container Toolkit
  ansible.builtin.apt:
    name: "{{ gpu_packages }}"
    update_cache: true
    allow_change_held_packages: true
    allow_downgrade: true
  vars:
    gpu_packages:
      - nvidia-container-toolkit={{ nvidia_container_toolkit }}
      - nvidia-container-toolkit-base={{ nvidia_container_toolkit }}
      - libnvidia-container-tools={{ nvidia_container_toolkit }}
      - libnvidia-container1={{ nvidia_container_toolkit }}

- name: Hold the NVIDIA Container Toolkit version
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: [nvidia-container-toolkit, nvidia-container-toolkit-base, libnvidia-container-tools, libnvidia-container1]
