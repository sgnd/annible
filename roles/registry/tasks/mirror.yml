# Copy pinned images into the local registry as <registry>/<name>:<tag>.
# Online: copied straight from the internet, for every CPU type in the cluster (amd64, arm64).
# Offline: loaded from the bundle (one CPU type).
# Runs on the first manager, and fills the registry of every manager.
# Input: registry_mirror_images (list of keys in versions.yml images).

- name: Check images in registry
  ansible.builtin.uri:
    url: "https://{{ item.1 }}/v2/{{ item.0 }}/manifests/{{ images[item.0].tag }}"
    headers:
      Accept: >-
        application/vnd.oci.image.index.v1+json,
        application/vnd.docker.distribution.manifest.list.v2+json,
        application/vnd.oci.image.manifest.v1+json,
        application/vnd.docker.distribution.manifest.v2+json
    ca_path: "/etc/docker/certs.d/{{ registry_addr }}/ca.crt"
    url_username: "{{ registry_user }}"
    url_password: "{{ registry_password }}"
    force_basic_auth: true
    status_code: [200, 404]
  loop: "{{ registry_mirror_images | product(registry_manager_addrs) | list }}"
  loop_control:
    label: "{{ item.0 }} on {{ item.1 }}"
  delegate_to: "{{ swarm_leader }}"
  register: registry_mirror_check

- name: Push missing images to registry
  ansible.builtin.shell:
    cmd: |
      set -e
      {% if offline %}
      docker load -q -i {{ bundle_dir }}/images/{{ item.item.0 }}.tar.gz
      docker tag {{ image.repo }}:{{ image.tag }} {{ dst }}
      docker push -q {{ dst }}
      {% else %}
      docker buildx imagetools create {{ registry_platforms | map('regex_replace', '^', '--platform linux/') | join(' ') }} \
        --tag {{ dst }} {{ image.repo }}@{{ image.digest }}
      {% endif %}
    executable: /bin/bash
  vars:
    image: "{{ images[item.item.0] }}"
    dst: "{{ item.item.1 }}/{{ item.item.0 }}:{{ image.tag }}"
    # Online, the image must also be there for every CPU type (a new arm64 server, for example).
    have: "{{ (item.json | default({})).manifests | default([]) | selectattr('platform', 'defined') | map(attribute='platform.architecture') }}"
  loop: "{{ registry_mirror_check.results }}"
  loop_control:
    label: "{{ item.item.0 }} on {{ item.item.1 }}"
  when: item.status == 404 or (not offline and registry_platforms | difference(have) | length > 0)
  delegate_to: "{{ swarm_leader }}"
  changed_when: true
  # Downloads sometimes fail for a moment (DNS, network). Try again before giving up.
  register: registry_push
  retries: 3
  delay: 15
  until: registry_push is not failed
