# Local image registry on every manager, with the same images. Every node trusts its
# certificate and logs in. Apps pull images from here, so the cluster also works without internet.

- name: Run registry on the managers
  ansible.builtin.include_tasks: server.yml
  when: inventory_hostname in groups['managers']

- name: Read registry CA
  ansible.builtin.slurp:
    src: "{{ registry_dir }}/ca/ca.crt"
  delegate_to: "{{ swarm_leader }}"
  run_once: true
  register: registry_ca

# The first manager also uses each manager's registry by IP, to copy the images into all of them.
- name: Create Docker certs directory for registry
  ansible.builtin.file:
    path: "/etc/docker/certs.d/{{ item }}"
    state: directory
    mode: "0755"
  loop: "{{ registry_names }}"

- name: Trust registry CA in Docker
  ansible.builtin.copy:
    dest: "/etc/docker/certs.d/{{ item }}/ca.crt"
    content: "{{ registry_ca.content | b64decode }}"
    mode: "0644"
  loop: "{{ registry_names }}"

# The first manager copies images into the registry with "docker buildx imagetools", which reads
# only the system's CA list. Only this server trusts the registry CA system-wide (its key is here anyway).
- name: Trust registry CA on the first manager
  ansible.builtin.copy:
    dest: /usr/local/share/ca-certificates/ansibro-registry.crt
    content: "{{ registry_ca.content | b64decode }}"
    mode: "0644"
  register: registry_system_ca
  when: inventory_hostname == swarm_leader

- name: Update the system CA list
  ansible.builtin.command: update-ca-certificates
  when: registry_system_ca.changed  # noqa: no-handler
  changed_when: true

- name: Check registry is reachable
  ansible.builtin.uri:
    url: "https://{{ registry_addr }}/v2/"
    ca_path: "/etc/docker/certs.d/{{ registry_addr }}/ca.crt"
    url_username: "{{ registry_user }}"
    url_password: "{{ registry_password }}"
    force_basic_auth: true
  register: registry_check
  retries: 10
  delay: 3
  until: registry_check.status == 200
  no_log: true

- name: Check if Docker is logged in to the registry
  ansible.builtin.command: grep -qF '"{{ item }}"' /root/.docker/config.json
  loop: "{{ registry_names }}"
  register: registry_login_check
  failed_when: false
  changed_when: false

# The login is saved in /root/.docker/config.json (root only). The password goes in through stdin.
- name: Log Docker in to the registry
  ansible.builtin.command:
    cmd: docker login --username {{ registry_user }} --password-stdin {{ item.item }}
    stdin: "{{ registry_password }}"
  loop: "{{ registry_login_check.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc != 0
  changed_when: true
  no_log: true
