# Firewall: deny everything, then open only what we need.
#
# The wanted rules are saved in a file. When that file changes (for example a new
# ssh.allow_from or a removed node), the firewall is reset and rebuilt, so old rules go away.
# Rules added by hand are removed too: put your own in firewall_allow in config.yml.
# (During a rebuild the firewall is off for a few seconds.)

- name: Save wanted firewall rules
  ansible.builtin.copy:
    dest: /etc/ufw/ansibro-rules.txt
    content: |
      # Managed by ansibro. Change config.yml instead of this file.
      ssh {{ ansible_port }} from {{ common_ssh_allow_from | join(', ') }}
      web 80, 443: {{ common_web }}
      cluster nodes: {{ common_cluster_ips | join(', ') }}
      cluster tcp: {{ common_cluster_tcp_ports | join(', ') }}
      cluster udp: {{ common_cluster_udp_ports | join(', ') }}
      k3s pods and services: {{ common_k3s_cidrs | join(', ') }}
      wireguard from: {{ common_wireguard_hosts | join(', ') }}
      ssh replies from: {{ common_cluster_hosts | join(', ') }}
      docker interfaces: {{ common_docker_interfaces | join(', ') }}
      your rules: {{ firewall_allow | default([]) | to_json }}
    mode: "0644"
  register: common_firewall_rules

# Not a handler: the reset must happen now, before the rules below are added again.
- name: Reset firewall because the rules changed
  ansible.builtin.command: ufw --force reset
  when: common_firewall_rules.changed  # noqa: no-handler
  changed_when: true

- name: Allow SSH
  community.general.ufw:
    rule: allow
    port: "{{ ansible_port | string }}"
    proto: tcp
    from_ip: "{{ item }}"
  loop: "{{ common_ssh_allow_from }}"

- name: Allow your own rules (firewall_allow)
  community.general.ufw:
    rule: allow
    port: "{{ item.port | string }}"
    proto: "{{ item.proto | default('tcp') }}"
    from_ip: "{{ item.from | default('any') }}"
  loop: "{{ firewall_allow | default([]) }}"

# Only where Traefik runs (traefik_nodes in group_vars): the other servers need no web ports.
- name: Allow HTTP and HTTPS where Traefik runs
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: ["80", "443"]
  when: common_web

# Other cluster servers may use only the ports this server needs to offer: swarm, registry,
# the apps on it and the monitoring agents (see common_cluster_tcp_ports). Up to 15 ports per rule.
- name: Allow app and swarm TCP ports from other cluster nodes
  community.general.ufw:
    rule: allow
    from_ip: "{{ item.0 }}"
    port: "{{ item.1 | join(',') }}"
    proto: tcp
  loop: "{{ common_cluster_ips | product(common_cluster_tcp_ports | batch(15) | list) | list }}"

- name: Allow swarm UDP ports from other cluster nodes
  community.general.ufw:
    rule: allow
    from_ip: "{{ item }}"
    port: "{{ common_cluster_udp_ports | join(',') }}"
    proto: udp
  loop: "{{ common_cluster_ips }}"
  when: common_cluster_udp_ports | length > 0

- name: Allow k3s pods and services
  community.general.ufw:
    rule: allow
    from_ip: "{{ item }}"
  loop: "{{ common_k3s_cidrs }}"

- name: Allow WireGuard from other cluster nodes
  community.general.ufw:
    rule: allow
    port: "{{ wireguard_port | string }}"
    proto: udp
    from_ip: "{{ item }}"
  loop: "{{ common_wireguard_hosts }}"

# When the installer runs on a server, it talks to the others over SSH. The firewall lets their
# replies in only while it remembers the connection, and it forgets when it starts or Docker starts.
# Then the install hangs. So always let SSH replies from the other servers in.
# Replies come back to a short-lived local port (32768-60999 on Linux), so only those are opened.
- name: Allow SSH replies from other cluster nodes
  community.general.ufw:
    rule: allow
    proto: tcp
    from_ip: "{{ item }}"
    from_port: "{{ ansible_port | string }}"
    port: "32768:60999"
  loop: "{{ common_cluster_hosts }}"

# Containers on this server can reach apps that use the host network.
- name: Allow traffic from local Docker networks
  community.general.ufw:
    rule: allow
    direction: in
    interface: "{{ item }}"
  loop: "{{ common_docker_interfaces }}"

# Ports that Docker publishes skip the rules above (Docker sends them on before ufw sees them).
# Traefik's metrics port 8082 is one: only the other cluster servers may use it.
# Docker checks the DOCKER-USER chain first, so the limit goes there.
- name: Limit Traefik's metrics port to the cluster servers
  ansible.builtin.blockinfile:
    path: /etc/ufw/after.rules
    marker: "# {mark} ANSIBRO TRAEFIK METRICS"
    block: |
      *filter
      :DOCKER-USER - [0:0]
      {% for ip in common_cluster_ips %}
      -A DOCKER-USER -p tcp -m conntrack --ctorigdstport 8082 --ctdir ORIGINAL -s {{ ip }} -j RETURN
      {% endfor %}
      -A DOCKER-USER -p tcp -m conntrack --ctorigdstport 8082 --ctdir ORIGINAL -j DROP
      -A DOCKER-USER -j RETURN
      COMMIT
    state: "{{ 'present' if 8082 in common_cluster_tcp_ports else 'absent' }}"
  register: common_docker_user

- name: Enable firewall
  community.general.ufw:
    state: enabled
    direction: incoming
    policy: deny

- name: Load the changed Docker port limit
  ansible.builtin.command: ufw reload
  when: common_docker_user.changed  # noqa: no-handler
  changed_when: true
