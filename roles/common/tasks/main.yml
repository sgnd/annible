- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Add cluster nodes to /etc/hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} swarm nodes"
    block: |
      {% for host in groups['all'] %}
      {{ hostvars[host].node_ip }} {{ host }}
      {% endfor %}

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    update_cache: true
    cache_valid_time: 3600

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone | default('UTC') }}"

- name: Enable chrony
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true

- name: Apply sysctl settings
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-swarm.conf
    reload: true
  loop: "{{ common_sysctl | dict2items }}"

- name: Create journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"

- name: Limit journald disk usage
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/90-swarm.conf
    content: |
      [Journal]
      SystemMaxUse={{ common_journald_max_use }}
    mode: "0644"
  notify: Restart journald

- name: Configure firewall
  ansible.builtin.import_tasks: firewall.yml
