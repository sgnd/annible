# Base OS setup for every node: hostname, packages, time, kernel settings, firewall.

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

# On cloud servers (AWS, DigitalOcean, ...) cloud-init can set the old hostname and /etc/hosts
# back on reboot. Swarm apps are placed by hostname, so tell cloud-init to keep ours.
- name: Look for cloud-init
  ansible.builtin.stat:
    path: /etc/cloud/cloud.cfg.d
  register: common_cloud_init

- name: Keep hostname and /etc/hosts after reboot
  ansible.builtin.copy:
    dest: /etc/cloud/cloud.cfg.d/99-ansibro.cfg
    content: |
      # Managed by ansibro: keep the hostname and /etc/hosts that ansibro set.
      preserve_hostname: true
      manage_etc_hosts: false
    mode: "0644"
  when: common_cloud_init.stat.exists

- name: Add cluster nodes to /etc/hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ansibro nodes"
    block: |
      {% for host in groups['all'] %}
      {{ hostvars[host].node_ip }} {{ host }}
      {% endfor %}
      {{ registry_ip }} {{ registry_host }}

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    update_cache: true
    cache_valid_time: 3600

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone | default('UTC') }}"

# In a container (for example Proxmox LXC) the host keeps the time,
# and chrony does not start there (Ubuntu 26.04 skips it on purpose).
- name: Enable chrony
  ansible.builtin.service:
    name: chrony
    state: "{{ omit if ansible_virtualization_type in ['lxc', 'container', 'docker', 'podman', 'systemd-nspawn', 'openvz'] else 'started' }}"
    enabled: true

- name: Apply sysctl settings
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-ansibro.conf
    reload: true
  loop: "{{ common_sysctl | dict2items }}"

- name: Create journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"

- name: Limit journald disk usage
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/90-ansibro.conf
    content: |
      [Journal]
      SystemMaxUse={{ common_journald_max_use }}
    mode: "0644"
  notify: Restart journald

- name: Configure firewall
  ansible.builtin.import_tasks: firewall.yml
