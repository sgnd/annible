# Base OS setup for every node: hostname, packages, time, kernel settings, firewall.

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Add cluster nodes to /etc/hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} annible nodes"
    block: |
      {% for host in groups['all'] %}
      {{ hostvars[host].node_ip }} {{ host }}
      {% endfor %}

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    update_cache: true
    cache_valid_time: 3600

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone | default('UTC') }}"

# In a container (for example Proxmox LXC) the host keeps the time,
# and chrony does not start there (Ubuntu 26.04 skips it on purpose).
- name: Enable chrony
  ansible.builtin.service:
    name: chrony
    state: "{{ omit if ansible_virtualization_type in ['lxc', 'container', 'docker', 'podman', 'systemd-nspawn', 'openvz'] else 'started' }}"
    enabled: true

- name: Apply sysctl settings
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-annible.conf
    reload: true
  loop: "{{ common_sysctl | dict2items }}"

- name: Create journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"

- name: Limit journald disk usage
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/90-annible.conf
    content: |
      [Journal]
      SystemMaxUse={{ common_journald_max_use }}
    mode: "0644"
  notify: Restart journald

- name: Configure firewall
  ansible.builtin.import_tasks: firewall.yml
