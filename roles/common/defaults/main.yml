common_packages:
  - ca-certificates
  - curl
  - gnupg
  - chrony
  - ufw
  - jq
  - wireguard-tools  # for wireguard: true (small, so always installed)
  - restic           # for backup:
  - age              # to keep state/ encrypted when the installer runs here (scripts/state.sh)

common_sysctl:
  net.ipv4.ip_forward: 1
  net.core.somaxconn: 4096
  vm.max_map_count: 262144
  vm.swappiness: 10
  fs.inotify.max_user_watches: 524288
  fs.inotify.max_user_instances: 1024

common_journald_max_use: 1G

# Firewall inputs (see tasks/firewall.yml).
common_ssh_allow_from: "{{ (ssh.allow_from | default([])) or ['any'] }}"
common_cluster_ips: "{{ groups['all'] | difference([inventory_hostname]) | map('extract', hostvars, 'node_ip') | sort }}"
# The real addresses (host) of the other servers, which answer SSH.
common_cluster_hosts: "{{ groups['all'] | difference([inventory_hostname]) | map('extract', hostvars, 'node_host') | unique | sort }}"
# With wireguard: the real addresses of the other servers, which send WireGuard traffic.
common_wireguard_hosts: "{{ groups['all'] | difference([inventory_hostname]) | map('extract', hostvars, 'node_host') | sort if wireguard else [] }}"

# Ports the other cluster servers may use on this server. Every other port is closed to them too.
# An app on its own server (Docker Compose) and the ports it needs:
common_app_ports:
  postgres: [5432]
  mariadb: [3306]
  redis: [6379]
  valkey: [6379]
  rustfs: [9000, 9001]
  garage: [3900, 3901]                      # S3, and Garage servers talking to each other
  rabbitmq: [5672, 15672, 15692]            # AMQP, web page, metrics
  nats: [4222, 8222]
  uptimekuma: [3001]
  beszel: [8090]
  openbao: [8200, 8201]
  prometheus: [9090, 3100, 9093, 3000]      # metrics, logs, alerts, Grafana
  victoria: [8428, 9428, 8880, 9093, 3000]  # metrics, logs, rules, alerts, Grafana
common_cluster_tcp_ports: >-
  {{ (([2377, registry_port] if inventory_hostname in groups['managers'] else [])
  + ([7946] if inventory_hostname in groups['swarm'] else [])
  + ([8082] if monitoring_app and 'traefik' in apps and inventory_hostname in traefik_nodes else [])
  + ([9100, 9280, 9598, 9187, 9104, 9121] if monitoring_app else [])
  + ([45876] if 'beszel' in apps else [])
  + (node_apps | map('extract', common_app_ports) | flatten))
  | unique | sort }}
# Swarm: node discovery and the overlay networks.
common_cluster_udp_ports: "{{ [7946, 4789] if inventory_hostname in groups['swarm'] else [] }}"

# docker0: default bridge. docker_gwbridge: how swarm containers reach the host.
common_docker_interfaces: [docker0, docker_gwbridge]
