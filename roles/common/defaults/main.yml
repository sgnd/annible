common_packages:
  - ca-certificates
  - curl
  - gnupg
  - chrony
  - ufw
  - jq

common_sysctl:
  net.ipv4.ip_forward: 1
  net.core.somaxconn: 4096
  vm.max_map_count: 262144
  vm.swappiness: 10
  fs.inotify.max_user_watches: 524288
  fs.inotify.max_user_instances: 1024

common_journald_max_use: 1G
