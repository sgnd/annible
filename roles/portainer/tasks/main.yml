# Portainer: web UI to manage the swarm. Agent runs on every swarm node.

- name: Create Portainer directories
  ansible.builtin.file:
    path: "{{ portainer_dir }}/data"
    state: directory
    mode: "0700"

# Only read on first start; change the password in the UI afterwards.
- name: Write initial admin password
  ansible.builtin.copy:
    dest: "{{ portainer_dir }}/admin_password"
    content: "{{ portainer_password }}"
    mode: "0600"
  no_log: true

- name: Mirror Portainer images
  ansible.builtin.include_role:
    name: registry
    tasks_from: mirror
  vars:
    registry_mirror_images: [portainer, portainer-agent]

- name: Write Portainer stack
  when: orchestrator == 'swarm'
  ansible.builtin.template:
    src: stack.yml.j2
    dest: "{{ portainer_dir }}/stack.yml"
    mode: "0600"
  diff: false  # has a password
  register: portainer_stack

- name: Deploy Portainer
  when: orchestrator == 'swarm'
  ansible.builtin.include_role:
    name: swarm
    tasks_from: deploy
  vars:
    swarm_stack: portainer
    swarm_stack_changed: "{{ portainer_stack.changed }}"


# k3s: a manifest in k3s's folder; k3s applies it by itself.
- name: Write Portainer for k3s
  ansible.builtin.template:
    src: k3s.yaml.j2
    dest: /var/lib/rancher/k3s/server/manifests/ansibro-portainer.yaml
    mode: "0600"
  diff: false  # has passwords
  when: orchestrator == 'k3s'
