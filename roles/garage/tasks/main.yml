# Garage: S3-compatible storage. Apps use http://<server ip>:3900 with the access and secret key.
# On 3 servers (garage: [s1, s2, s3]) every file is kept on all 3; any of them answers.

- name: Create Garage folders
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - "{{ garage_dir }}"
    - "{{ garage_dir }}/meta"
    - "{{ garage_dir }}/data"

# Garage keeps one copy of each file per server (replication_factor). It cannot change that later:
# with more or fewer Garage servers in config.yml, stop before writing the new number.
- name: Read the Garage config there is now
  ansible.builtin.slurp:
    src: "{{ garage_dir }}/garage.toml"
  register: garage_config_now
  failed_when: false  # not there on a new server
  no_log: true  # has a password

- name: Stop if the number of Garage servers changed
  ansible.builtin.assert:
    that: garage_copies_seen | difference([app_nodes.garage | length | string]) | length == 0
    fail_msg: >-
      Garage keeps {{ garage_copies_seen | join(' or ') }} copies of each file (one per server), but config.yml now
      has garage on {{ app_nodes.garage | length }} server(s). Garage cannot change this later. Put garage in
      config.yml back to {{ garage_copies_seen | join(' or ') }} server(s). For another number, set up a new Garage
      and copy the files over (for example with rclone). See docs/how-to.md, "Garage on 3 servers".
  vars:
    garage_copies_seen: >-
      {{ app_nodes.garage | map('extract', hostvars) | selectattr('garage_config_now.content', 'defined')
      | map(attribute='garage_config_now.content') | map('b64decode')
      | map('regex_findall', '(?m)^replication_factor = ([0-9]+)') | select | map('first') | unique | list }}
  run_once: true

- name: Write Garage config
  ansible.builtin.template:
    src: garage.toml.j2
    dest: "{{ garage_dir }}/garage.toml"
    mode: "0600"
  diff: false  # has a password
  register: garage_config

- name: Mirror Garage image
  ansible.builtin.include_role:
    name: registry
    tasks_from: mirror
  vars:
    registry_mirror_images: [garage]

- name: Write Garage compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ garage_dir }}/compose.yml"
    mode: "0600"

- name: Start Garage
  ansible.builtin.include_role:
    name: docker
    tasks_from: compose
  vars:
    docker_compose_app: garage
    docker_compose_restart: "{{ garage_config.changed }}"

# Each server's Garage ID, like 563e...@10.0.0.5:3901.
- name: Get Garage node ID
  ansible.builtin.command: docker exec garage /garage node id -q
  register: garage_node_id
  changed_when: false
  retries: 10
  delay: 3
  until: garage_node_id.rc == 0

# The first Garage server does the cluster steps below for all of them.
- name: Connect the Garage servers
  ansible.builtin.command: docker exec garage /garage node connect {{ hostvars[item].garage_node_id.stdout }}
  loop: "{{ app_nodes.garage[1:] }}"
  when: garage_first
  changed_when: false

# A new Garage server stores nothing until it gets a place in the layout.
# Each server is its own zone, so the 3 copies of a file go to 3 different servers.
# The admin API gives the layout as JSON: its version, and the servers that have a place.
- name: Get Garage layout
  ansible.builtin.uri:
    url: http://127.0.0.1:3903/v2/GetClusterLayout
    headers:
      Authorization: "Bearer {{ garage_admin_token }}"
  register: garage_layout
  when: garage_first
  no_log: true

- name: Add new servers to the Garage layout
  ansible.builtin.command: docker exec garage /garage layout assign -z {{ item }} -c {{ garage_capacity }} {{ garage_id }}
  vars:
    garage_id: "{{ hostvars[item].garage_node_id.stdout.split('@')[0] }}"
  loop: "{{ app_nodes.garage }}"
  when: garage_first and garage_id not in garage_layout.json.roles | map(attribute='id')
  register: garage_assign
  changed_when: true

# The new places count only after the next layout version is applied.
- name: Apply the new Garage layout
  ansible.builtin.uri:
    url: http://127.0.0.1:3903/v2/ApplyClusterLayout
    method: POST
    headers:
      Authorization: "Bearer {{ garage_admin_token }}"
    body_format: json
    body:
      version: "{{ garage_layout.json.version + 1 }}"
  when: garage_first and garage_assign is changed
  changed_when: true
  no_log: true

# The key goes in through Garage's admin API, so the secret is never on a command line.
- name: Get Garage keys
  ansible.builtin.uri:
    url: http://127.0.0.1:3903/v2/ListKeys
    headers:
      Authorization: "Bearer {{ garage_admin_token }}"
  register: garage_keys
  when: garage_first
  no_log: true

- name: Add Garage access key
  ansible.builtin.uri:
    url: http://127.0.0.1:3903/v2/ImportKey
    method: POST
    headers:
      Authorization: "Bearer {{ garage_admin_token }}"
    body_format: json
    body:
      name: default
      accessKeyId: "{{ garage_access_key }}"
      secretAccessKey: "{{ garage_secret_key }}"
  when: garage_first and garage_access_key not in garage_keys.json | map(attribute='id')
  register: garage_key_added
  changed_when: true
  no_log: true

# A new key may not make buckets. Allow it, so apps can make their own buckets with this key.
- name: Let the Garage key make buckets
  ansible.builtin.uri:
    url: http://127.0.0.1:3903/v2/UpdateKey?id={{ garage_access_key }}
    method: POST
    headers:
      Authorization: "Bearer {{ garage_admin_token }}"
    body_format: json
    body:
      allow:
        createBucket: true
  when: garage_key_added is changed  # noqa: no-handler
  changed_when: true
  no_log: true
