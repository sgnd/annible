# Swarmpit: web UI to manage the swarm. Its databases (CouchDB, InfluxDB) run on the first manager.
# The installer makes Swarmpit's admin user (password in state/secrets/swarmpit_admin). Log in at https://swarmpit.<domain>.

# CouchDB sets its own data folder to user 5984 and mode 0755 when it starts, so we do the same.
# The swarmpit folder above it stays private (0700).
- name: Create Swarmpit folders
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ swarmpit_dir }}", owner: root, mode: "0700" }
    - { path: "{{ swarmpit_dir }}/couchdb", owner: "5984", mode: "0755" }
    - { path: "{{ swarmpit_dir }}/influxdb", owner: root, mode: "0700" }

- name: Mirror Swarmpit images
  ansible.builtin.include_role:
    name: registry
    tasks_from: mirror
  vars:
    registry_mirror_images: [swarmpit, swarmpit-agent, couchdb, influxdb]

- name: Write Swarmpit stack
  ansible.builtin.template:
    src: stack.yml.j2
    dest: "{{ swarmpit_dir }}/stack.yml"
    mode: "0600"
  register: swarmpit_stack

- name: Deploy Swarmpit
  ansible.builtin.include_role:
    name: swarm
    tasks_from: deploy
  vars:
    swarm_stack: swarmpit
    swarm_stack_changed: "{{ swarmpit_stack.changed }}"

# Swarmpit makes its first admin user through its API (/initialize). The installer calls it from inside
# the Swarmpit container, on this server. Once there is an admin user, Swarmpit answers 400: nothing changes.
- name: Make the Swarmpit admin user
  ansible.builtin.shell:
    cmd: >-
      cid=$(docker ps -q --latest --filter label=com.docker.swarm.service.name=swarmpit_app);
      test -n "$cid" &&
      docker exec -i "$cid" curl -s -o /dev/null -w '%{http_code}' -X POST
      -H 'Content-Type: application/json' -d @- http://localhost:8080/initialize
    stdin: "{{ {'username': 'admin', 'password': swarmpit_password} | to_json }}"
  register: swarmpit_init
  until: swarmpit_init.stdout in ['200', '201', '400']
  retries: 30
  delay: 10
  changed_when: swarmpit_init.stdout in ['200', '201']
  no_log: true
