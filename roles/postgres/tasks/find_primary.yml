# Sets postgres_primary_node: the server where PostgreSQL takes writes now.
# One server: that one. Patroni: the leader in Patroni's list of the cluster, once its PostgreSQL runs.
# (Its name is the node name: see SPILO_CONFIGURATION in tasks/main.yml.)
- name: Ask Patroni which server is the primary
  ansible.builtin.uri:
    url: "http://{{ hostvars[app_nodes.postgres[0]].node_ip }}:8008/cluster"  # every Patroni knows the whole cluster
  register: postgres_cluster
  until: >-
    (postgres_cluster.json | default({})).members | default([]) | selectattr('role', 'equalto', 'leader')
    | selectattr('state', 'equalto', 'running') | list | length > 0
  retries: 60
  delay: 5
  run_once: true
  when: postgres_patroni

- name: Remember the primary
  ansible.builtin.set_fact:
    postgres_primary_node: >-
      {{ (postgres_cluster.json.members | selectattr('role', 'equalto', 'leader') | map(attribute='name') | first)
      if postgres_patroni else apps.postgres }}
  run_once: true
