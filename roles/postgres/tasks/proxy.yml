# postgres-proxy: the address cluster apps use for PostgreSQL with Patroni (database_host).
# Runs on the first manager, before the cluster apps.

- name: Create postgres-proxy folder
  ansible.builtin.file:
    path: "{{ apps_dir }}/postgres-proxy"
    state: directory
    mode: "0700"

- name: Write postgres-proxy settings
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: "{{ apps_dir }}/postgres-proxy/haproxy.cfg"
    mode: "0644"
  register: postgres_proxy_config

- name: Mirror HAProxy image
  ansible.builtin.include_role:
    name: registry
    tasks_from: mirror
  vars:
    registry_mirror_images: [haproxy]

- name: Write postgres-proxy stack
  ansible.builtin.template:
    src: proxy-stack.yml.j2
    dest: "{{ apps_dir }}/postgres-proxy/stack.yml"
    mode: "0600"
  register: postgres_proxy_stack
  when: orchestrator == 'swarm'

- name: Deploy postgres-proxy
  ansible.builtin.include_role:
    name: swarm
    tasks_from: deploy
  vars:
    swarm_stack: postgres-proxy
    swarm_stack_changed: "{{ postgres_proxy_stack.changed }}"
  when: orchestrator == 'swarm'

- name: Write postgres-proxy for k3s
  ansible.builtin.template:
    src: proxy-k3s.yaml.j2
    dest: /var/lib/rancher/k3s/server/manifests/ansibro-postgres-proxy.yaml
    mode: "0600"
  when: orchestrator == 'k3s'

- name: Find the PostgreSQL primary
  ansible.builtin.include_tasks: find_primary.yml
