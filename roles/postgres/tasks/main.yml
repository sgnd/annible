# PostgreSQL. Apps connect to <server ip>:5432 as user "postgres".
# With more servers (postgres: [db1, db2]) the first is the primary and the others are replicas:
# read-only copies that follow it all the time. See README "Database replicas".

# The app in the container runs as user 999, so it must own its data folder.
- name: Create PostgreSQL folders
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "0700"
  loop:
    - { path: "{{ postgres_dir }}", owner: root }
    - { path: "{{ postgres_dir }}/data", owner: "999" }

- name: Write PostgreSQL password
  ansible.builtin.copy:
    dest: "{{ postgres_dir }}/.env"
    content: |
      POSTGRES_PASSWORD={{ postgres_password }}
      REPLICATION_PASSWORD={{ postgres_replication_password }}
    mode: "0600"
  no_log: true

- name: Mirror PostgreSQL image
  ansible.builtin.include_role:
    name: registry
    tasks_from: mirror
  vars:
    registry_mirror_images: [postgres]

- name: Write PostgreSQL compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ postgres_dir }}/compose.yml"
    mode: "0600"

- name: Start PostgreSQL
  ansible.builtin.include_role:
    name: docker
    tasks_from: compose
  vars:
    docker_compose_app: postgres
  when: postgres_primary

# Restore (./install.sh -e restore=true): load the dump from the backup into the new, empty database.
- name: Load PostgreSQL backup
  ansible.builtin.shell: docker exec -i postgres psql -U postgres -q -f - < {{ apps_dir }}/backup/stage/dumps/postgres.sql
  when: restore | bool and postgres_primary
  changed_when: true

# Replicas log in as "replicator", a user that can only copy the database.
- name: Create the replication user
  ansible.builtin.command:
    cmd: docker exec -i postgres psql -U postgres -q -v ON_ERROR_STOP=1
    stdin: |
      SELECT 'CREATE ROLE replicator REPLICATION LOGIN' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'replicator') \gexec
      ALTER ROLE replicator WITH REPLICATION LOGIN PASSWORD '{{ postgres_replication_password }}';
  when: postgres_primary and postgres_replicas | length > 0
  changed_when: false
  no_log: true

# A replica copies with a "replication" login, which the default rules do not allow.
- name: Let the replicas connect
  ansible.builtin.lineinfile:
    path: "{{ postgres_dir }}/data/{{ postgres_data_subdir }}/pg_hba.conf"
    line: "host replication replicator {{ hostvars[item].node_ip }}/32 scram-sha-256"
  loop: "{{ postgres_replicas }}"
  when: postgres_primary
  register: postgres_hba

- name: Reload PostgreSQL rules
  ansible.builtin.command: docker exec postgres psql -U postgres -q -c "SELECT pg_reload_conf()"
  when: postgres_hba.changed  # noqa: no-handler
  changed_when: true

- name: Look for the replica's data
  ansible.builtin.stat:
    path: "{{ postgres_dir }}/data/{{ postgres_data_subdir }}/PG_VERSION"
  register: postgres_data
  when: not postgres_primary

# The first copy of the whole database. -R makes it a replica that keeps following the primary,
# -C -S keeps a slot on the primary, so it waits for this replica when it is behind.
- name: Copy the primary to the replica
  ansible.builtin.command:
    cmd: >-
      docker run --rm --network host --user 999:999
      --env-file {{ postgres_dir }}/.env
      -v {{ postgres_dir }}/data:/var/lib/postgresql
      --entrypoint sh {{ registry_addr }}/postgres:{{ images.postgres.tag }}
      -c 'PGPASSWORD="$REPLICATION_PASSWORD" pg_basebackup -h {{ postgres_primary_ip }} -U replicator
      -D /var/lib/postgresql/{{ postgres_data_subdir }} -R -X stream -C -S {{ inventory_hostname | replace("-", "_") }}'
  when: not postgres_primary and not postgres_data.stat.exists
  changed_when: true

- name: Start the PostgreSQL replica
  ansible.builtin.include_role:
    name: docker
    tasks_from: compose
  vars:
    docker_compose_app: postgres
  when: not postgres_primary
