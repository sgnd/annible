# PostgreSQL. Apps connect to <server ip>:5432 as user "postgres".
# On 2 or more servers (postgres: [db1, db2, db3]) it runs with Patroni: one primary, the others
# follow it, and when the primary is down another one becomes the primary by itself. Cluster apps
# then connect through database-proxy, which always goes to the primary. See docs/how-to.md "Database replicas".

- name: Create PostgreSQL folder
  ansible.builtin.file:
    path: "{{ postgres_dir }}"
    state: directory
    mode: "0700"

# PostgreSQL in the container runs as user 999 (one server) or 101, group 103 (Spilo, with Patroni).
- name: Create PostgreSQL data folder
  ansible.builtin.file:
    path: "{{ postgres_dir }}/data"
    state: directory
    owner: "{{ '101' if postgres_patroni else '999' }}"
    group: "{{ '103' if postgres_patroni else '999' }}"
    mode: "0700"

- name: Write PostgreSQL passwords
  ansible.builtin.copy:
    dest: "{{ postgres_dir }}/.env"
    content: |
      POSTGRES_PASSWORD={{ postgres_password }}
      PGPASSWORD_SUPERUSER={{ postgres_password }}
      PGPASSWORD_STANDBY={{ postgres_replication_password }}
      PGPASSWORD_ADMIN={{ postgres_password }}
      {% if postgres_patroni %}
      # Patroni's API: reading (health, which server is the primary) is open, changes need this login.
      # (Spilo starts Patroni without the container's PATRONI_* settings; it adds this to Patroni's config.)
      SPILO_CONFIGURATION={"restapi": {"authentication": {"username": "patroni", "password": "{{ postgres_patroni_api_password }}"}}}
      {% endif %}
    mode: "0600"
  no_log: true

- name: Mirror PostgreSQL image
  ansible.builtin.include_role:
    name: registry
    tasks_from: mirror
  vars:
    registry_mirror_images: ["{{ 'spilo' if postgres_patroni else 'postgres' }}"]

- name: Write PostgreSQL compose file
  ansible.builtin.template:
    src: "{{ 'patroni-compose.yml.j2' if postgres_patroni else 'compose.yml.j2' }}"
    dest: "{{ postgres_dir }}/compose.yml"
    mode: "0600"

- name: Start PostgreSQL
  ansible.builtin.include_role:
    name: docker
    tasks_from: compose
  vars:
    docker_compose_app: postgres

# With Patroni the servers agree on a primary first; then this finds it (postgres_primary_node).
- name: Find the PostgreSQL primary
  ansible.builtin.include_tasks: find_primary.yml

# Restore (./install.sh -e restore=true): load the dump from the backup into the new, empty database.
# With Patroni the dump is on the server that was the primary at backup time. The new primary
# can be another server: then the dump goes there through this machine (the one running the installer).
- name: Restore with Patroni
  when: restore | bool and postgres_patroni
  block:
    - name: Look for the PostgreSQL dump
      ansible.builtin.stat:
        path: "{{ postgres_dump }}"
      register: postgres_dump_here

    - name: Find the server with the PostgreSQL dump
      ansible.builtin.set_fact:
        postgres_dump_node: >-
          {{ app_nodes.postgres | map('extract', hostvars) | selectattr('postgres_dump_here.stat.exists')
          | map(attribute='inventory_hostname') | first | default('') }}
      run_once: true

    - name: Stop if no server has the PostgreSQL dump
      ansible.builtin.assert:
        that: postgres_dump_node != ''
        fail_msg: "No PostgreSQL dump in the backup of {{ app_nodes.postgres | join(', ') }}."
      run_once: true

    - name: Get the dump from {{ postgres_dump_node }}
      ansible.builtin.fetch:
        src: "{{ postgres_dump }}"
        dest: "{{ playbook_dir }}/state/postgres-restore.sql"
        flat: true
      delegate_to: "{{ postgres_dump_node | default(inventory_hostname) }}"  # read before "when"
      run_once: true
      when: postgres_dump_node != postgres_primary_node

    - name: Copy the dump to the primary
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/state/postgres-restore.sql"
        dest: "{{ postgres_dump }}"
        mode: "0600"
      when: inventory_hostname == postgres_primary_node and postgres_dump_node != postgres_primary_node

    - name: Delete the dump on this machine
      ansible.builtin.file:
        path: "{{ playbook_dir }}/state/postgres-restore.sql"
        state: absent
      delegate_to: localhost
      become: false
      run_once: true

- name: Load PostgreSQL backup
  ansible.builtin.shell: >-
    docker exec -i postgres psql -U postgres -q -f -
    < {{ postgres_dump }}
  when: restore | bool and inventory_hostname == postgres_primary_node
  changed_when: true
