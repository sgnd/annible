# MariaDB. Apps connect to <server ip>:3306 as user "root".
# On 3 servers (mariadb: [m1, m2, m3]) it runs as a Galera cluster: every server has all the data.
# Cluster apps connect through database-proxy. See docs "Database replicas".

# The app in the container runs as user 999, so it must own its data folder.
- name: Create MariaDB folders
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "0700"
  loop:
    - { path: "{{ mariadb_dir }}", owner: root }
    - { path: "{{ mariadb_dir }}/data", owner: "999" }

- name: Write MariaDB password
  ansible.builtin.copy:
    dest: "{{ mariadb_dir }}/.env"
    content: |
      MARIADB_ROOT_PASSWORD={{ mariadb_password }}
      MARIADB_AUTO_UPGRADE=1
    mode: "0600"
  no_log: true

- name: Mirror MariaDB image
  ansible.builtin.include_role:
    name: registry
    tasks_from: mirror
  vars:
    registry_mirror_images: [mariadb]

- name: Write Galera config
  ansible.builtin.template:
    src: galera.cnf.j2
    dest: "{{ mariadb_dir }}/galera.cnf"
    mode: "0644"
  diff: false  # has the root password
  when: mariadb_galera

# Galera: a new cluster is started by the first server alone. "grastate.dat" exists once a
# server has been in the cluster.
- name: Look for Galera state
  ansible.builtin.stat:
    path: "{{ mariadb_dir }}/data/grastate.dat"
  register: mariadb_grastate
  when: mariadb_galera

- name: Decide if the Galera cluster is new
  ansible.builtin.set_fact:
    mariadb_new_cluster: >-
      {{ mariadb_galera and inventory_hostname == apps.mariadb
      and not (app_nodes.mariadb | map('extract', hostvars, ['mariadb_grastate', 'stat', 'exists']) | select | list) }}

- name: Start a new cluster on this server (Galera)
  ansible.builtin.set_fact:
    mariadb_start_flag: "{{ mariadb_new_cluster }}"

- name: Write MariaDB compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ mariadb_dir }}/compose.yml"
    mode: "0600"

- name: Start MariaDB on the first server
  ansible.builtin.include_role:
    name: docker
    tasks_from: compose
  vars:
    docker_compose_app: mariadb
  when: inventory_hostname == apps.mariadb

# Restore (./install.sh -e restore=true): load the dump from the backup into the new, empty database.
# With Galera before the other servers join, so they get it all with the full copy they make then.
- name: Load MariaDB backup
  ansible.builtin.shell: >-
    docker exec -i mariadb sh -c 'MYSQL_PWD="$MARIADB_ROOT_PASSWORD" mariadb -uroot'
    < {{ apps_dir }}/backup/stage/dumps/mariadb.sql
  when: restore | bool and inventory_hostname == apps.mariadb  # Galera copies it to the others
  changed_when: true

# One at a time: each new server copies all the data from a running one.
- name: Start MariaDB on the other servers
  ansible.builtin.include_role:
    name: docker
    tasks_from: compose
    apply:
      throttle: 1
  vars:
    docker_compose_app: mariadb
  when: inventory_hostname != apps.mariadb

# The cluster runs now, so the first server joins it like the others from now on.
- name: Restart the first server as a normal member
  when: mariadb_new_cluster
  block:
    - name: Drop the start flag
      ansible.builtin.set_fact:
        mariadb_start_flag: false

    - name: Write MariaDB compose file without the start flag
      ansible.builtin.template:
        src: compose.yml.j2
        dest: "{{ mariadb_dir }}/compose.yml"
        mode: "0600"

    - name: Restart MariaDB on the first server
      ansible.builtin.include_role:
        name: docker
        tasks_from: compose
      vars:
        docker_compose_app: mariadb

# Galera: a small check that database-proxy asks (port {{ mariadb_check_port }}), see galera-check.sh.j2.
# systemd listens on the port and runs the script for each connection; no extra program is needed.
- name: Set up the Galera check
  when: mariadb_galera
  block:
    - name: Write the Galera check script
      ansible.builtin.template:
        src: galera-check.sh.j2
        dest: /usr/local/bin/ansibro-galera-check
        mode: "0700"

    - name: Write the Galera check socket
      ansible.builtin.copy:
        dest: /etc/systemd/system/ansibro-galera-check.socket
        content: |
          [Unit]
          Description=Ansibro Galera check for database-proxy

          [Socket]
          ListenStream={{ node_ip }}:{{ mariadb_check_port }}
          # The address can come later than the socket at boot (for example with WireGuard).
          FreeBind=true
          Accept=yes
          MaxConnections=10

          [Install]
          WantedBy=sockets.target
        mode: "0644"
      register: mariadb_check_socket

    - name: Write the Galera check service
      ansible.builtin.copy:
        dest: /etc/systemd/system/ansibro-galera-check@.service
        content: |
          [Unit]
          Description=Ansibro Galera check

          [Service]
          ExecStart=/usr/local/bin/ansibro-galera-check
          StandardInput=socket
          StandardOutput=socket
          StandardError=journal
        mode: "0644"

    - name: Start the Galera check
      ansible.builtin.systemd_service:
        name: ansibro-galera-check.socket
        state: "{{ 'restarted' if mariadb_check_socket.changed else 'started' }}"
        enabled: true
        daemon_reload: true
