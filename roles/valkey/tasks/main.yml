# Valkey. Apps connect to <server ip>:6379 with the password.
# On 3 servers: one primary, two copies, and Sentinel (port 26379) for automatic failover.
# Apps that know Sentinel ask it for the primary (Authelia does); see README "Database replicas".

# The app in the container runs as user 999, so it must own its data folder.
- name: Create Valkey folders
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "0700"
  loop:
    - { path: "{{ valkey_dir }}", owner: root }
    - { path: "{{ valkey_dir }}/data", owner: "999" }
    - { path: "{{ valkey_dir }}/sentinel", owner: "999" }

# The primary now: Sentinel knows it after a failover; on a new install it is the first server.
- name: Ask Sentinel for the Valkey primary
  ansible.builtin.command: docker exec valkey-sentinel valkey-cli -p 26379 SENTINEL get-master-addr-by-name ansibro
  register: valkey_sentinel_answers
  delegate_to: "{{ item }}"
  loop: "{{ app_nodes.valkey }}"
  run_once: true
  failed_when: false
  changed_when: false
  when: valkey_ha

- name: Remember the Valkey primary
  ansible.builtin.set_fact:
    valkey_primary_ip: >-
      {{ ((valkey_sentinel_answers.results | default([]) | selectattr('rc', 'defined') | selectattr('rc', 'equalto', 0)
      | map(attribute='stdout_lines') | select | map('first') | list) + [hostvars[app_nodes.valkey[0]].node_ip])[0] }}
  run_once: true

- name: Write Valkey config
  ansible.builtin.template:
    src: valkey.conf.j2
    dest: "{{ valkey_dir }}/valkey.conf"
    mode: "0644"
  diff: false  # has a password
  register: valkey_config

# Only the first time: Sentinel rewrites this file itself (who the primary is, the other Sentinels).
- name: Write Sentinel config
  ansible.builtin.template:
    src: sentinel.conf.j2
    dest: "{{ valkey_dir }}/sentinel/sentinel.conf"
    owner: "999"
    group: "999"
    mode: "0600"
    force: false
  when: valkey_ha
  no_log: true

- name: Mirror Valkey image
  ansible.builtin.include_role:
    name: registry
    tasks_from: mirror
  vars:
    registry_mirror_images: [valkey]

- name: Write Valkey compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ valkey_dir }}/compose.yml"
    mode: "0600"
  diff: false  # has the password

# One server at a time: with 3 servers, a config change must not restart them all together.
- name: Start Valkey
  ansible.builtin.include_role:
    name: docker
    tasks_from: compose
    apply:
      throttle: 1
  vars:
    docker_compose_app: valkey
    docker_compose_restart: "{{ valkey_config.changed }}"
