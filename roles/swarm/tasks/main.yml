# Create the swarm on the first manager, then join the other nodes.
# Note: {% raw %}...{% endraw %} keeps Docker's own {{ }} format text away from Ansible.

- name: Check if this node is in a swarm
  ansible.builtin.command: docker info --format '{% raw %}{{ .Swarm.LocalNodeState }}{% endraw %}'
  register: swarm_state
  changed_when: false

- name: Create swarm on the first manager
  ansible.builtin.command: >-
    docker swarm init
    --advertise-addr {{ node_ip }}
    --listen-addr {{ node_ip }}:2377
    --default-addr-pool {{ swarm_address_pool }}
    --default-addr-pool-mask-length 24
  when:
    - inventory_hostname == swarm_leader
    - swarm_state.stdout != 'active'
  changed_when: true

- name: Get manager join token
  ansible.builtin.command: docker swarm join-token -q manager
  register: swarm_manager_token
  delegate_to: "{{ swarm_leader }}"
  run_once: true
  changed_when: false
  no_log: true  # the token gives control of the swarm

- name: Get worker join token
  ansible.builtin.command: docker swarm join-token -q worker
  register: swarm_worker_token
  delegate_to: "{{ swarm_leader }}"
  run_once: true
  changed_when: false
  no_log: true  # the token gives control of the swarm

# Managers join one by one, so the swarm keeps a working majority.
- name: Join swarm
  ansible.builtin.command: >-
    docker swarm join
    --token {{ join_token }}
    --advertise-addr {{ node_ip }}
    --listen-addr {{ node_ip }}:2377
    {{ hostvars[swarm_leader].node_ip }}:2377
  vars:
    join_token: "{{ swarm_manager_token.stdout if node_role == 'manager' else swarm_worker_token.stdout }}"
  when:
    - inventory_hostname != swarm_leader
    - swarm_state.stdout != 'active'
  throttle: 1
  changed_when: true
  no_log: true

- name: Get node ID
  ansible.builtin.command: docker info --format '{% raw %}{{ .Swarm.NodeID }}{% endraw %}'
  register: swarm_node_id
  changed_when: false

- name: Get current node labels
  ansible.builtin.command: >-
    docker node inspect {{ swarm_node_id.stdout }}
    --format '{% raw %}{{ json .Spec.Labels }}{% endraw %}'
  register: swarm_node_labels
  delegate_to: "{{ swarm_leader }}"
  changed_when: false

# Labels only get added. Remove old ones by hand, on a manager: sudo docker node update --label-rm <key> <node>
- name: Add node labels from config.yml
  ansible.builtin.command: >-
    docker node update
    {% for key, value in node_labels.items() %}--label-add {{ key }}={{ value }} {% endfor %}
    {{ swarm_node_id.stdout }}
  vars:
    current_labels: "{{ swarm_node_labels.stdout | from_json or {} }}"
  when: current_labels | combine(node_labels) != current_labels
  delegate_to: "{{ swarm_leader }}"
  changed_when: true

- name: Get overlay networks
  ansible.builtin.command: docker network ls --filter driver=overlay --format '{% raw %}{{ .Name }}{% endraw %}'
  register: swarm_existing_networks
  run_once: true
  delegate_to: "{{ swarm_leader }}"
  changed_when: false

- name: Create overlay networks
  ansible.builtin.command: docker network create --driver overlay --attachable {{ item }}
  loop: "{{ swarm_networks | difference(swarm_existing_networks.stdout_lines) }}"
  run_once: true
  delegate_to: "{{ swarm_leader }}"
  changed_when: true

# Kong gets its own network, shared only with Traefik and your API services,
# so other apps cannot reach Kong's admin API. Fixed subnet: Kong trusts it for client IPs.
- name: Create Kong network
  ansible.builtin.command: docker network create --driver overlay --attachable --subnet {{ kong_subnet }} kong
  when:
    - "'kong' in apps"
    - "'kong' not in swarm_existing_networks.stdout_lines"
  run_once: true
  delegate_to: "{{ swarm_leader }}"
  changed_when: true
